<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Graph HG | Create Session</title>
    <style>
      :root { --accent:#369b5f; --accent-2:#2db36e; --bg:#0f1411; --panel:#1b1b1bcc; --text:#eef8f1; }
      *{box-sizing:border-box} body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:center;font-family:'Trebuchet MS',Tahoma,sans-serif;background:#121212;color:var(--text);overflow:hidden}
      canvas{position:fixed;inset:0;z-index:0}.card{position:relative;z-index:1;width:min(92vw,430px);background:var(--panel);border:1px solid #2b4432;border-radius:14px;padding:28px 24px;box-shadow:0 0 16px rgba(54,155,95,.35)}
      h1{margin:0 0 18px;font-size:1.35rem;text-align:center;border-bottom:2px solid var(--accent);padding-bottom:10px}.stack{display:grid;gap:12px}
      label{font-size:.9rem;color:#d8e5db} input{width:100%;margin-top:6px;padding:11px 12px;border-radius:8px;border:1px solid #455a4c;background:#232723;color:#fff}
      input:focus{outline:none;border-color:var(--accent-2);box-shadow:0 0 0 2px rgba(54,155,95,.2)}.actions{display:grid;gap:10px;margin-top:14px}
      button,.link-btn{border:none;border-radius:12px;padding:12px;font-weight:700;text-decoration:none;text-align:center;cursor:pointer}
      button{background:linear-gradient(135deg,#1a593a,var(--accent-2));color:#fff}.link-btn{background:transparent;border:1px solid #3f664b;color:#9cd2aa}
      #statusText{min-height:22px;margin:0 0 10px;text-align:center;font-size:.88rem;color:#fda4a4}.status-success{color:#8ef0ae!important}
      .custom-cursor{width:6px;height:6px;background:var(--accent);border-radius:50%;position:fixed;pointer-events:none;z-index:3;box-shadow:0 0 8px var(--accent)}
      @media (pointer:coarse){.custom-cursor{display:none}}
      .app-brand{position:fixed;top:16px;left:18px;z-index:4;font-weight:800;letter-spacing:.3px}
      .app-brand .g{color:#39ff14}.app-brand .s{color:#edf9f0}
    </style>
  </head>
  <body>
    <div class="app-brand"><span class="g">Graph</span><span class="s">/Session</span></div>
    <div class="custom-cursor"></div>
    <canvas id="bg"></canvas>
    <main class="card">
      <h1>ساخت نشست جدید</h1>
      <p id="statusText"></p>
      <form id="createSessionForm" class="stack">
        <label>نام شما<input type="text" name="ownerName" required /></label>
        <label>عنوان نشست<input type="text" name="roomTitle" required /></label>
        <label>رمز نشست<input type="password" name="roomPassword" minlength="8" required /></label>
        <label>کد دسترسی ۴ رقمی<input type="text" name="accessCode" minlength="4" maxlength="4" inputmode="numeric" required /></label>
        <div class="actions">
          <button type="submit">ایجاد نشست</button>
          <a class="link-btn" href="/login.html">ورود به نشست موجود</a>
        </div>
      </form>
    </main>
    <script>
      const c=document.getElementById('bg'),x=c.getContext('2d');let p=[];const m={x:null,y:null};const n=matchMedia('(pointer:coarse)').matches?70:160;
      function rs(){c.width=innerWidth;c.height=innerHeight;p=Array.from({length:n},()=>({x:Math.random()*c.width,y:Math.random()*c.height,s:Math.random()*1.3+.4,vx:Math.random()*.5-.25,vy:Math.random()*.5-.25}))}
      function d(){x.clearRect(0,0,c.width,c.height);for(let i=0;i<p.length;i++){const a=p[i];a.x+=a.vx;a.y+=a.vy;if(a.x<0||a.x>c.width)a.vx*=-1;if(a.y<0||a.y>c.height)a.vy*=-1;x.fillStyle='#39ff14';x.beginPath();x.arc(a.x,a.y,a.s,0,6.28);x.fill();for(let j=i+1;j<p.length;j++){const b=p[j],dx=a.x-b.x,dy=a.y-b.y,dist=Math.hypot(dx,dy);if(dist<84){x.strokeStyle='rgba(54,155,95,.28)';x.lineWidth=.4;x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke();}} if(m.x!=null&&Math.hypot(a.x-m.x,a.y-m.y)<100){x.strokeStyle='rgba(57,255,20,.2)';x.beginPath();x.moveTo(a.x,a.y);x.lineTo(m.x,m.y);x.stroke();}} requestAnimationFrame(d)}
      addEventListener('resize',rs);addEventListener('mousemove',e=>{m.x=e.clientX;m.y=e.clientY;const cur=document.querySelector('.custom-cursor'); if(cur){cur.style.left=e.clientX+'px';cur.style.top=e.clientY+'px';}}); rs(); d();
    </script>
    <script>
const form = document.getElementById("createSessionForm");
const statusText = document.getElementById("statusText");

function setStatus(message, type = "") {
  statusText.textContent = message;
  statusText.className = type;
}

function arrayBufferToBase64(buffer) {
  const bytes = new Uint8Array(buffer);
  let binary = "";
  bytes.forEach((byte) => {
    binary += String.fromCharCode(byte);
  });
  return btoa(binary);
}

async function deriveSessionKey(password, roomCode) {
  const encoder = new TextEncoder();
  const baseKey = await crypto.subtle.importKey("raw", encoder.encode(password), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: encoder.encode(`graph-room-${roomCode}`), iterations: 600_000, hash: "SHA-256" }, baseKey, { name: "AES-GCM", length: 256 }, true, ["encrypt", "decrypt"]);
  const exported = await crypto.subtle.exportKey("raw", key);
  return arrayBufferToBase64(exported);
}

async function api(path, options = {}) {
  const response = await fetch(path, { headers: { "Content-Type": "application/json" }, ...options });
  const data = await response.json();
  if (!response.ok) throw new Error(data.error || "خطا در ارتباط با سرور");
  return data;
}

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  const formData = new FormData(form);
  const ownerName = String(formData.get("ownerName") || "").trim();
  const roomTitle = String(formData.get("roomTitle") || "").trim();
  const roomPassword = String(formData.get("roomPassword") || "").trim();
  const accessCode = String(formData.get("accessCode") || "").replace(/\D/g, "").slice(0, 4);
  if (roomPassword.length < 8) return setStatus("رمز نشست باید حداقل ۸ کاراکتر باشد.", "status-error");
  if (accessCode.length !== 4) return setStatus("کد دسترسی ۴ رقمی معتبر نیست.", "status-error");

  try {
    setStatus("در حال ساخت نشست...");
    const data = await api("/api/rooms", { method: "POST", body: JSON.stringify({ ownerName, roomTitle, roomPassword, accessCode }) });
    const joinData = await api("/api/rooms/join", { method: "POST", body: JSON.stringify({ userName: ownerName, roomCode: data.room.code, roomPassword }) });
    const roomKey = await deriveSessionKey(roomPassword, data.room.code);
    sessionStorage.setItem("meetingSession", JSON.stringify({ roomCode: data.room.code, userName: ownerName, authToken: joinData.authToken, participantSessionId: joinData.participant?.sessionId, isOwner: Boolean(joinData.permissions?.isOwner), roomKey }));
    setStatus(`نشست ساخته شد. کد نشست: ${data.room.code}`, "status-success");
    window.location.href = `/room.html?code=${encodeURIComponent(data.room.code)}`;
  } catch (error) {
    setStatus(error.message, "status-error");
  }
});
    </script>
  </body>
</html>
